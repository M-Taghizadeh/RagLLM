events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── HTTPS ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        client_max_body_size 500m;
        root /usr/share/nginx/html;
        index index.html;

        error_page 413 = @json_413;
        location @json_413 {
            default_type application/json;
            return 413 '{"detail":"حجم فایل آپلودی بیش از حد مجاز است."}';
        }

        # ── API + SSE — فقط این بخش به بک‌اند می‌رود ─────────────────
        location /api/ {
            proxy_pass         http://ragbot:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # سقف حجم هر فایل را بک‌اند از .env اعمال می‌کند (MAX_UPLOAD_MB / CHAT_ATTACH_MAX_DOC_MB)
            client_max_body_size      0;
            proxy_request_buffering   off;

            proxy_buffering           off;
            proxy_cache               off;
            # بک‌اند هر ۱۵ ثانیه heartbeat می‌فرستد؛ این سقف فقط برای اتصال واقعاً مرده است
            proxy_connect_timeout     60s;
            proxy_send_timeout        3600s;
            proxy_read_timeout        3600s;
            chunked_transfer_encoding on;

            # موقع لود مدل ممکن است بک‌اند موقتاً مشغول شود؛ UI نباید بخوابد
            proxy_next_upstream off;
        }

        # ── Frontend استاتیک از خود nginx (Indep از بک‌اند) ───────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
