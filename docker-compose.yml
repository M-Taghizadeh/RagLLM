# ── RagBot v2 — Docker Compose ───────────────────────────────────────────────
#
# Services:
#   ragbot    — FastAPI backend + static frontend  (internal :8000)
#   nginx     — reverse proxy + SSL               (ports 8080, 8443)
#   ollama    — LLM inference server              (port 11434)
#              profile: linux-gpu  →  فقط روی لینوکس با GPU اجرا می‌شود
#              روی ویندوز: Ollama را به‌صورت native نصب کنید
#
# Quick start (لینوکس — GPU):
#   1. cp .env.example .env
#   2. python scripts/download_embedding.py
#   3. docker compose --profile linux-gpu up -d --build
#   4. https://<server-ip>:8443
#
# Quick start (بدون GPU container):
#   1. cp .env.example .env  و OLLAMA_URL را تنظیم کنید
#   2. python scripts/download_embedding.py
#   3. docker compose up -d --build
#   4. https://<server-ip>:8443
# ─────────────────────────────────────────────────────────────────────────────

networks:
  ragbot_net:
    name: ragbot_net

services:

  # ── RagBot FastAPI backend ──────────────────────────────────────────────────
  ragbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
        USE_CUDA: ${USE_CUDA:-0}
    image: ragbot:latest
    container_name: ragbot-app
    restart: unless-stopped
    runtime: ${DOCKER_RUNTIME:-runc}
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro
      - faiss_data:/app/backend/faiss_db
      - sqlite_data:/app/backend
    networks:
      - ragbot_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx (reverse proxy + SSL) ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ragbot-nginx
    restart: unless-stopped
    ports:
      - "7443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - ragbot_net
    depends_on:
      ragbot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Ollama LLM server (لینوکس + GPU) ────────────────────────────────────────
  ollama:
    profiles: ["linux-gpu"]
    image: ollama/ollama:latest
    container_name: ragbot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - ragbot_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    name: ragbot_ollama_data
  faiss_data:
    name: ragbot_faiss_data
  sqlite_data:
    name: ragbot_sqlite_data
