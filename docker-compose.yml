# ── RagBot v2 — Docker Compose ───────────────────────────────────────────────
#
# Services:
#   ragbot    — FastAPI backend + static frontend  (internal :8000)
#   nginx     — reverse proxy + SSL               (ports 8080, 8443)
#   ollama    — LLM inference server              (port 11434)
#              profile: linux-gpu  →  فقط روی لینوکس با GPU اجرا می‌شود
#              روی ویندوز: Ollama را به‌صورت native نصب کنید
#
# Quick start (لینوکس — GPU):
#   1. cp .env.example .env
#      DOCKER_OLLAMA_URL=http://ollama:11434
#   2. python scripts/download_embedding.py
#   3. docker compose --profile linux-gpu up -d --build
#   4. open the published HTTPS port (see nginx service)
#
# Quick start (بدون GPU container):
#   1. cp .env.example .env
#      OLLAMA_URL=http://localhost:11434          (manual)
#      DOCKER_OLLAMA_URL=http://host.docker.internal:11434
#   2. python scripts/download_embedding.py
#   3. docker compose up -d --build
#   4. open the published HTTPS port (see nginx service)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  ragbot_net:
    name: ragbot_net

services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ragbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ragbot}
      POSTGRES_USER:     ${POSTGRES_USER:-ragbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragbot_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ragbot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragbot} -d ${POSTGRES_DB:-ragbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── RagBot FastAPI backend ──────────────────────────────────────────────────
  ragbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
        USE_CUDA: ${USE_CUDA:-0}
    image: ragbot:latest
    container_name: ragbot-app
    restart: unless-stopped
    runtime: ${DOCKER_RUNTIME:-runc}
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/ragbot.db
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ragbot}:${POSTGRES_PASSWORD:-ragbot_secret}@postgres:5432/${POSTGRES_DB:-ragbot}
      # Override OLLAMA_URL from env_file: inside the container localhost ≠ host
      # Manual (.env): OLLAMA_URL=http://localhost:11434
      # Docker host Ollama: DOCKER_OLLAMA_URL=http://host.docker.internal:11434
      # Docker profile linux-gpu: DOCKER_OLLAMA_URL=http://ollama:11434
      - OLLAMA_URL=${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./models:/app/models:ro
      - faiss_data:/app/backend/faiss_db
      - sqlite_data:/app/data
      - uploads_data:/app/data/uploads
    networks:
      - ragbot_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx (reverse proxy + SSL) ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ragbot-nginx
    restart: unless-stopped
    ports:
      - "7443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - ragbot_net
    depends_on:
      ragbot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Ollama LLM server (لینوکس + GPU) ────────────────────────────────────────
  ollama:
    profiles: ["linux-gpu"]
    image: ollama/ollama:latest
    container_name: ragbot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - ragbot_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    name: ragbot_ollama_data
  faiss_data:
    name: ragbot_faiss_data
  sqlite_data:
    name: ragbot_sqlite_data
  postgres_data:
    name: ragbot_postgres_data
  uploads_data:
    name: ragbot_uploads_data
